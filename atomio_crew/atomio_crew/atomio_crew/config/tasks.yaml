scout_assets:
  agent: asset_scraper
  description: >
    Source free assets for Atom.IO.

    GAME SUMMARY:
    {gdd}

    Needs to cover: (1) glowing particles for the atom core, electrons, energy orbs and
    enemy deaths; (2) virtual joystick / touch controls (left move stick, right aim stick);
    (3) HUD pieces (health bar, buttons, panels, font); (4) short sci-fi SFX for shooting,
    pickups and evolving (the energy bar filling up); (5) a way to get bloom/glow on mid-range Android.

    Steps: search with free_asset_catalog (use several keyword queries), check every
    license with license_check, drop anything paid, non-commercial or share-alike.
    Plan a local_path for each asset under Assets/ThirdParty/<Vendor>/<Pack>/ (or
    Packages/ for Unity packages). Return 6 to 10 assets.
  expected_output: >
    An AssetManifest JSON object only: assets (name, category, source_url, license,
    price_usd = 0, local_path, unity_compat_note, used_for) and search_notes.

review_assets_and_plan:
  agent: lead_architect
  context: [scout_assets]
  description: >
    Review the Asset Scraper's manifest against the Atom.IO GDD below and the constraints
    (Unity {unity_version}, Android API 24+, 2 GB RAM baseline device, landscape, no runtime
    network calls, no external dependencies beyond the GDD).

    GDD:
    {gdd}

    Approve only what the game needs; when two assets do the same job, approve one and
    reject the other with a reason. Then write an ordered implementation plan for the core
    features (player atom + orbiting electrons, release attack, enemies, spawner, energy
    bar that evolves the player mid-run when full and then empties to 0, per-level arena
    layout, tier config loading for the 10 levels H..Ne) and prefab/scene setup notes
    (Lobby scene, Arena scene, prefabs, physics layers).
  expected_output: >
    An ArchitectReview JSON object only: approved_assets (exact names from the manifest),
    rejected_assets (name, reason), implementation_plan, prefab_scene_notes.

design_tiers:
  agent: level_designer
  context: [review_assets_and_plan]
  description: >
    Design Atom.IO's {level_count} levels, one per element from Hydrogen (Z=1) to Neon
    (Z=10). Call element_groups to see the levels and their groups, and gdd_formula_table
    if you want the fixed numbers (HP, slots, energy bar size) for any element.

    Produce:
    1. ONE spawn_curve for the whole game (enemy spawn interval shrinks with time:
       interval = base / (1 + k * minutes); enemy HP starts at 10 and grows linearly per
       level and per minute; energy per orb grows exponentially per minute survived). The
       energy bar needs 50 + 3Z + 5(Z-1)^2 energy per evolution (53 at H, 397 at F) and every orb
       holds a fixed 2 energy, so tune orb
       and frequency so H takes about one minute and later levels a few minutes each.
       Wild electrons: Hydrogen spawns none (its one slot is always full); from Helium on,
       set electron_base_interval_s + electron_interval_per_tier, max_wild_electrons_base +
       max_wild_electrons_per_tier, electron_lifetime_s and electron_min_spawn_distance so
       early levels are generous and later ones scarcer.
    2. A level_design for EVERY element Z = 1..10 (exactly ten): level_name (max 24 chars),
       design_note (how it differs from the previous level), core_visual (primary_hex,
       secondary_hex as #RRGGBB, glow_intensity 0-3, pattern in solid/rings/swirl/crystal/
       noise/pulse/lattice, texture_asset = an approved asset name or 'procedural',
       shader_note), arena_theme (background_hex, grid_hex, ambient_particle_asset = approved
       asset name or 'none'), arena_layout (obstacle_pattern in none/ring/scatter/cross/
       spiral/lattice, obstacle_count 0-16 with 0 only for 'none', obstacle_size 0.5-3)
       and a small trait inspired by that element's real chemistry (all multipliers 0.7-1.3).
       Hydrogen is the tutorial: keep its arena open. Neon is the finale.
    3. A neutral fallback design with atomic_number = 0.

    There is no evolution cost and no failure chance: never design around them.
    Only these asset names may be referenced (from the Lead Architect's approval):
    see the approved_assets in your context.
  expected_output: >
    A TierDesignSet JSON object only: spawn_curve, level_designs (10), fallback.

implement_core_scripts:
  agent: lead_architect
  context: [review_assets_and_plan, design_tiers]
  description: >
    Write the core Atom.IO gameplay scripts for Unity {unity_version} following your plan.

    GDD:
    {gdd}

    Hard requirements:
    - Complete, compilable C# files, each under Assets/Scripts/AtomIO/<Folder>/<TypeName>.cs,
      one public type per file with the file name equal to the type name, all inside
      namespace AtomIO (sub-namespaces allowed).
    - Use only UnityEngine, UnityEngine.UI, UnityEngine.EventSystems, UnityEngine.SceneManagement,
      TMPro and System/System.Collections.Generic. No networking, no Newtonsoft, no other packages.
    - Unity 6 APIs (Rigidbody2D.linearVelocity, Object.FindFirstObjectByType).
    - FIRST call tier_json_contract. It returns a tier file built from the Level Designer's
      design in this run. Tier configs are loaded at arena start (and again on every
      mid-run evolution) with Resources.Load TextAsset
      from Resources/AtomIO/Tiers/tier_NNN (fallback: tier_fallback) and parsed with
      JsonUtility, so your serializable C# classes MUST have a public field for every key of
      that JSON (same names, same nesting). Core visuals must support every pattern and trait
      multiplier the Level Designer used, and the arena must build every obstacle_pattern.
    - Implement: GDD formulas (HP = 10 x Z, slots = Z, energy bar size 50 + 3Z + 5(Z-1)^2, fixed 2-energy orbs, final
      element Neon Z=10); the energy bar: every bit of energy collected fills it, and when it
      is full the player evolves immediately mid-run (HP refills, +1 slot, new look, trait and
      arena level) and the bar empties to 0 with no carry-over. There is NO evolution cost and
      NO failure chance. The bar keeps its progress between runs. Player movement
      from a left virtual stick; orbiting electrons (any electron can be thrown, even the last one;
      every run starts with 1; aim on the newest electron, released hit = 20, orbiting hit = 10); wild
      electron and energy orb pickup; enemies that chase in sight range and give up when the
      player escapes; contact damage 10; time-based spawner; pooled wild electrons that obey
      the tier's electrons block (interval, max_wild cap counting missed throws, lifetime with
      fade, min spawn distance) and look like glowing yellow spheres; per-level static obstacles;
      run end returns to the lobby; a lobby that shows the element and bar and starts a run;
      a win state at Neon; tutorial flags (run 1 as H: orbit damage and orbs; on first
      reaching He: throwing and picking up electrons).
    Also write changes_md: a CHANGES.md section listing every file and why it exists.
  expected_output: >
    A CodeBundle JSON object only: files (path, content) and changes_md.

validate_outputs:
  agent: lead_architect
  context: [design_tiers, implement_core_scripts]
  description: >
    Act as the validation gate (GDD 2.4/2.5). Call run_validation_suite exactly once. It
    expands the level designs into the 10 tier files and checks assets, level designs, GDD
    formulas, the energy-bar rules, C# structure, forbidden dependencies and the JSON-to-C#
    field contract.
    Report its errors and warnings faithfully; do not invent or hide any. approved_for_gate
    must be true only when the suite reports zero errors. In notes, tell the developer what
    to check by hand in the Unity editor (compile, play the tutorial run, evolve by filling the bar, reach Neon, etc.).
  expected_output: >
    A ValidationReport JSON object only: approved_for_gate, errors, warnings, notes.
